name: Deploy review gallery
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Decode and verify original image exports
        run: |
          python3 - <<'PY'
          import pathlib,json,base64,hashlib,shutil
          out=pathlib.Path('_site');out.mkdir()
          for n in ['index.html','app.js','style.css','manifest.json','.nojekyll']:
              shutil.copyfile(n,out/n)
          (out/'images').mkdir()
          m=json.loads(pathlib.Path('manifest.json').read_text())
          assert 27 <= len(m['cases']) <= 33
          for c in m['cases']:
              b=base64.b64decode(pathlib.Path('image-data',c['id']+'.b64').read_text(),validate=True)
              assert hashlib.sha256(b).hexdigest()==c['exportSha256']
              assert b[:8]==b'\x89PNG\r\n\x1a\n'
              (out/'images'/pathlib.Path(c['image']).name).write_bytes(b)
          print('Verified all nine original full-resolution PNG files.')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - uses: actions/deploy-pages@v4
        id: deployment
