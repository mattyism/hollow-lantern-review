name: Deploy review gallery
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify original image exports and authorized Kittl samples
        run: |
          python3 - <<'PY'
          import pathlib,json,base64,hashlib,shutil,urllib.request,urllib.parse,re,concurrent.futures
          out=pathlib.Path('_site');out.mkdir()
          for n in ['index.html','app.js','style.css','manifest.json','.nojekyll']:
              shutil.copyfile(n,out/n)
          (out/'images').mkdir()
          m=json.loads(pathlib.Path('manifest.json').read_text())
          assert 33 <= len(m['cases']) <= 45
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          def build(c):
              if not c.get('image'):return
              assert re.fullmatch(r'images/v[1-5]-[a-z0-9-]+\.png',c['image'])
              encoded=pathlib.Path('image-data',c['id']+'.b64')
              if encoded.is_file():
                  b=base64.b64decode(encoded.read_text(),validate=True)
              elif pathlib.Path('image-data',c['id']+'.parts').is_dir():
                  assert re.fullmatch(r'v5-(raven|axolotl|baphomet)-riverflow',c['id'])
                  pieces=sorted(pathlib.Path('image-data',c['id']+'.parts').glob('*.b64'))
                  assert 1 <= len(pieces) <= 30
                  b=base64.b64decode(''.join(p.read_text() for p in pieces),validate=True)
              else:
                  assert re.fullmatch(r'v5-(raven|axolotl|baphomet)-(ideogram|sunburst|nano)',c['id'])
                  url=c['sourceUrl'];u=urllib.parse.urlsplit(url)
                  assert u.scheme=='https' and u.netloc=='cache.kittl.com' and not u.query and not u.fragment
                  assert re.fullmatch(r'/pr:sharp/plain/api/users/[a-z0-9]+/uploads/[a-z0-9]+\.png',u.path)
                  with urllib.request.build_opener(NoRedirect()).open(url,timeout=60) as r:b=r.read(40000001)
              assert len(b)<=40000000
              assert hashlib.sha256(b).hexdigest()==c['exportSha256']
              assert b[:8]==b'\x89PNG\r\n\x1a\n'
              (out/'images'/pathlib.Path(c['image']).name).write_bytes(b)
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:list(pool.map(build,m['cases']))
          print('Verified original pixels for all available gallery images.')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - uses: actions/deploy-pages@v4
        id: deployment
